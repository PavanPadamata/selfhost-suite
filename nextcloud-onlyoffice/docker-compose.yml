services:
  nextcloud_db:
    image: mariadb:${MARIADB_VERSION}
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ${NEXTCLOUD_DB_VOLUME}:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - nextcloud_network

  nextcloud_app:
    image: nextcloud:${NEXTCLOUD_VERSION}
    restart: always
    ports:
      - ${NEXTCLOUD_PORT}:80
    depends_on:
      - nextcloud_db
      - redis
    volumes:
      - ${NEXTCLOUD_DATA_VOLUME}:/var/www/html
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      OVERWRITEPROTOCOL: ${OVERWRITEPROTOCOL}
      REDIS_HOST: ${REDIS_HOST}
    networks:
      - nextcloud_network
      - nginx_network

  # Cache and file locking for Nextcloud
  redis:
    image: redis:8.10-alpine
    container_name: ${REDIS_CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - nextcloud_network

  onlyoffice:
    image: onlyoffice/documentserver:${ONLYOFFICE_VERSION}
    restart: unless-stopped
    ports:
      - "${ONLYOFFICE_PORT}:80"
    depends_on:
      - onlyoffice_db
    environment:
      - POSTGRES_DB_HOST=${ONLYOFFICE_DB_HOST}
      - POSTGRES_DB_PORT=${ONLYOFFICE_DB_PORT}
      - POSTGRES_DB_NAME=${ONLYOFFICE_DB_NAME}
      - POSTGRES_DB_USER=${ONLYOFFICE_DB_USER}
      - POSTGRES_DB_PASS=${ONLYOFFICE_DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_HEADER=${JWT_HEADER}
    networks:
      - onlyoffice_network
      - nginx_network

  onlyoffice_db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${ONLYOFFICE_DB_NAME}
      - POSTGRES_USER=${ONLYOFFICE_DB_USER}
      - POSTGRES_PASSWORD=${ONLYOFFICE_DB_PASS}
    volumes:
      - ${ONLYOFFICE_DB_VOLUME}:/var/lib/postgresql
    networks:
      - onlyoffice_network

networks:
  nginx_network:
    external: true
  nextcloud_network:
  onlyoffice_network:
